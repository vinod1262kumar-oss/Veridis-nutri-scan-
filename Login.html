<script>
  let authMode = 'signin';
  let supabaseClient = null;

  function showAuthMessage(message, kind = 'info') {
    const bar = document.getElementById('auth-status-bar');
    if (!bar) return;

    const colors = {
      error: 'text-error',
      success: 'text-primary-container',
      info: 'text-secondary'
    };

    bar.classList.remove('hidden');
    bar.classList.add('flex');
    bar.replaceChildren();

    const messageElement = document.createElement('span');
    messageElement.className = colors[kind] || colors.info;
    messageElement.setAttribute('role', 'status');
    messageElement.textContent = message;

    bar.appendChild(messageElement);
  }

  function setBusy(busy, labelText) {
    const submitButton = document.getElementById('auth-submit-btn');
    const googleButtons = document.querySelectorAll('.google-auth-btn');

    submitButton.disabled = busy;

    googleButtons.forEach((button) => {
      button.disabled = busy;
    });

    submitButton.classList.toggle('opacity-60', busy);
    document.getElementById('submit-label').textContent = labelText;
  }

  function togglePasskeyVisibility() {
    const input = document.getElementById('passkey-input');
    const icon = document.getElementById('passkey-toggle-icon');
    const visible = input.type === 'password';

    input.type = visible ? 'text' : 'password';
    icon.textContent = visible ? 'visibility_off' : 'visibility';
  }

  function setMode(mode) {
    authMode = mode;

    const signin = document.getElementById('tab-signin');
    const signup = document.getElementById('tab-signup');

    signin.classList.remove(
      'bg-surface-container-lowest',
      'text-primary-container',
      'shadow-md'
    );

    signup.classList.remove(
      'bg-surface-container-lowest',
      'text-primary-container',
      'shadow-md'
    );

    const activeTab = mode === 'signin' ? signin : signup;
    activeTab.classList.add(
      'bg-surface-container-lowest',
      'text-primary-container',
      'shadow-md'
    );

    document.getElementById('submit-label').textContent =
      mode === 'signin' ? 'AUTHORIZE VAULT SESSION' : 'CREATE ACCOUNT';

    document.getElementById('passkey-input').autocomplete =
      mode === 'signin' ? 'current-password' : 'new-password';

    document.getElementById('auth-status-bar').classList.add('hidden');
  }

  function getSupabaseClient() {
    if (supabaseClient) return supabaseClient;

    const config = window.VERIDIS_SUPABASE_CONFIG;

    if (!window.supabase?.createClient) {
      throw new Error(
        'Supabase library did not load. Refresh the page and try again.'
      );
    }

    if (!config?.url || !config?.anonKey) {
      throw new Error(
        'Supabase is not configured. Check supabase-config.js.'
      );
    }

    supabaseClient = window.supabase.createClient(
      config.url,
      config.anonKey,
      {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true
        }
      }
    );

    return supabaseClient;
  }

  function openScanner() {
    // Scanner.html is in the root of your deployed website.
    window.location.assign('/Scanner.html');
  }

  // Email/password authentication
  document.getElementById('auth-form').addEventListener(
    'submit',
    async (event) => {
      event.preventDefault();

      const email = document.getElementById('clinical-id').value.trim();
      const password = document.getElementById('passkey-input').value;

      setBusy(
        true,
        authMode === 'signin' ? 'SIGNING IN...' : 'CREATING ACCOUNT...'
      );

      showAuthMessage('Connecting to authentication service...');

      try {
        const client = getSupabaseClient();

        const result =
          authMode === 'signin'
            ? await client.auth.signInWithPassword({ email, password })
            : await client.auth.signUp({
                email,
                password,
                options: {
                  emailRedirectTo:
                    window.location.origin + '/Login.html'
                }
              });

        if (result.error) throw result.error;

        if (authMode === 'signup' && !result.data.session) {
          setMode('signin');

          showAuthMessage(
            'Account created. Check your email to confirm your account before signing in.',
            'success'
          );

          return;
        }

        showAuthMessage('Login successful. Opening scanner...', 'success');

        openScanner();

      } catch (error) {
        showAuthMessage(
          error.message || 'Sign-in failed. Please try again.',
          'error'
        );
      } finally {
        setBusy(
          false,
          authMode === 'signin'
            ? 'AUTHORIZE VAULT SESSION'
            : 'CREATE ACCOUNT'
        );
      }
    }
  );

  // Google OAuth authentication
  async function signInWithGoogle() {
    setBusy(true, 'CONNECTING TO GOOGLE...');

    showAuthMessage('Opening Google sign-in...');

    try {
      const client = getSupabaseClient();

      const { error } = await client.auth.signInWithOAuth({
        provider: 'google',
        options: {
          redirectTo: window.location.origin + '/Login.html'
        }
      });

      if (error) throw error;

      // Supabase redirects the browser to Google.
      // Do not navigate away manually before OAuth finishes.

    } catch (error) {
      showAuthMessage(
        error.message || 'Google sign-in could not start.',
        'error'
      );

      setBusy(
        false,
        authMode === 'signin'
          ? 'AUTHORIZE VAULT SESSION'
          : 'CREATE ACCOUNT'
      );
    }
  }

  // Attach the same handler to both Google buttons.
  document.querySelectorAll('#google-auth-btn').forEach((button) => {
    button.addEventListener('click', signInWithGoogle);
  });

  // Check whether this page was opened after Google's OAuth callback.
  async function checkExistingSession() {
    try {
      const client = getSupabaseClient();

      const { data, error } = await client.auth.getSession();

      if (error) throw error;

      if (data.session) {
        showAuthMessage('Session restored. Opening scanner...', 'success');
        openScanner();
      }
    } catch (error) {
      showAuthMessage(
        error.message || 'Unable to verify your login session.',
        'error'
      );
    }
  }

  document.getElementById('tab-signin').addEventListener(
    'click',
    () => setMode('signin')
  );

  document.getElementById('tab-signup').addEventListener(
    'click',
    () => setMode('signup')
  );

  function simulateBiometricAuth() {
    showAuthMessage(
      'Biometric sign-in is a demo only. Use email/password or Google.',
      'info'
    );
  }

  // Run after the Supabase SDK and configuration script have loaded.
  window.addEventListener('load', checkExistingSession);
              </script>
